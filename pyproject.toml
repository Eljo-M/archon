[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "archon-engineering"
version = "0.1.0"
description = "Distributed issue-to-patch engineering platform"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.78,<2", "grpcio-tools>=1.78,<2", "protobuf>=6.31,<8",
  "redis>=5.2,<7", "asyncpg>=0.30,<1", "docker>=7.1,<8",
  "httpx>=0.28,<1", "prometheus-client>=0.21,<1",
  "tree-sitter>=0.25,<0.26", "tree-sitter-python>=0.25,<0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pyyaml>=6,<7"]
training = ["torch>=2.6,<3", "transformers>=4.49,<5", "peft>=0.14,<1", "datasets>=3.3,<5", "trl>=0.15,<1"]
gpu = ["triton>=3.2,<4; platform_system == 'Linux'"]

[project.scripts]
archon = "archon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"archon.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires running Redis and PostgreSQL"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
exclude = ["src/archon/generated/*"]
